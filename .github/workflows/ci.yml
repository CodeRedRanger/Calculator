name: CI/CD wxWidgets with vcpkg

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
    types: [closed]

jobs:
  release_web:
    name: Web Release
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: 
          submodules: true #Needed to fetch the vcpkg submodule

      - name: Clean build directory
     #  run: rm -f build/CMakeCache.txt
        run: rm -rf ${{ github.workspace }}/build

      - name: Create Build Directory
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Restore vcpkg cache
        uses: lukka/run-vcpkg@v11
        with:
          doNotRunVcpkgInstall: true # Let CMake do the install

      - name: Configure and build with CMake
        uses: lukka/run-cmake@v10
        with:
          #buildDirectory: ${{ github.workshop }}/build
          configurePreset: 'default' # Use your CMakePresets.json
          buildPreset: 'default' 
          # vcpkg-root is automatically found when used as a submodule

      - name: Get build artifact from container
        run: |
         cp ${{ github.workspace }}/build/Calc_App ./

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calc_App-binary
          path: ${{ github.workspace }}/build/Calc_App

