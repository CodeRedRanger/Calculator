  release_web:
    name: Web Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      #- name: Clean build directory
       # run: rm -rf /home/runner/work/Calculator/build

      #- name: Create Build Directory
       # run: cmake -E make_directory /home/runner/work/Calculator/build

      - name: Install Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y  gcc-multilib python3 curl zip unzip
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev

      - name: Checkout emsdk
        run: git clone https://github.com/emscripten-core/emsdk.git /home/runner/work/Calculator/emsdk

      - name: Configure Emscripten
        shell: bash

        # Change the directory to be emsdk instead of the project root
        working-directory: /home/runner/work/Calculator/emsdk
        run: |
          ./emsdk install latest
          ./emsdk activate latest

      - name: Configure CMake
        run: |
          pwd 
          cmake -S ./ -B ./build -DCMAKE_BUILD_TYPE=Release -Wno-dev -DCMAKE_TOOLCHAIN_FILE=/home/runner/work/Calculator/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake #won't work without above chain
          cmake -DCMAKE_TOOLCHAIN_FILE=/home/runner/work/Calculator/vcpkg/scripts/buildsystems/vcpkg.cmake -S .  -B ./build 
    
