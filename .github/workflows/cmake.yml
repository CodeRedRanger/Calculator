name: Release Build

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
    types: [closed]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: /home/runner/work/Calculator/vcpkg
    steps:
      - uses: actions/checkout@v4
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
          cd /home/runner/work/Calculator/vcpkg
          .\bootstrap-vcpkg.bat
      - name: Install wxWidgets via vcpkg
        run: |
          cd /home/runner/work/Calculator/vcpkg
          .\vcpkg.exe install wxwidgets:x64-windows
        
