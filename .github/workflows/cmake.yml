name: Release Build

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
    types: [closed]

jobs:

      
      #- name: Install wxWidgets with vcpkg #can't get this to work without json file configed properly
      #  uses: lukka/run-vcpkg@v11
      #  with: 
      #    runVcpkgInstall: true
         # vcpkgJsonGlob: /home/runner/work/Calculator/vcpkg #not needed
       #   vcpkgArguments: 'install wxwidgets:x64-windows-static'
          
  

  release_web:
    name: Web Release
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y  gcc-multilib python3 curl zip unzip
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev
          sudo apt-get update 
          sudo apt-get install -y libtool

     

      - name: Clean build directory
        run: rm -f build/CMakeCache.txt
        #run: rm -rf ${{ github.workspace }}\build

      - name: Create Build Directory
        run: cmake -E make_directory ${{ github.workspace }}\build

      - name: Install vcpkg 
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{ github.workspace }}/vcpkg
          cd ${{ github.workspace }}/vcpkg
          ./bootstrap-vcpkg.sh
          #cd ${{ github.workspace }}
          #vcpkg install

      - name: Install wxWidgets with vcpkg #can't get this to work without json file configed properly
        uses: lukka/run-vcpkg@v11
        with: 
          runVcpkgInstall: true

      - name: Set up CMake toolchain file
        run: |
         echo "CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV # -S .  -B ./build 

      - name: Installs including wxWidgets via vcpkg
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install

      - name: Integrate vcpkg
        run: vcpkg integrate install

      - name: Checkout emsdk
        run: git clone https://github.com/emscripten-core/emsdk.git ${{ github.workspace }}/emsdk

      - name: Configure Emscripten
        shell: bash
        run: |
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest

      - name: Configure CMake
        run: |
          cmake -S ./ -B ./build -DCMAKE_BUILD_TYPE=Release -Wno-dev -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake -DCMAKE_TOOLCHAIN_FILE=$ENV{VCPKG_ROOT}/vcpkg//scripts/buildsystems/vcpkg.cmake 
          #cmake -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -S .  -B ./build 
          #cmake -DwxWidgets_CONFIG_EXECUTABLE=${{ github.workspace }}/vcpkg_installed/x64-windows/share/wxwidgets
    
      - name: Build 

        run: cmake --build ./build --config Release
