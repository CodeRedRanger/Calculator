name: Release Build

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
    types: [closed]

jobs:

      
      #- name: Install wxWidgets with vcpkg #can't get this to work without json file configed properly
      #  uses: lukka/run-vcpkg@v11
      #  with: 
      #    runVcpkgInstall: true
         # vcpkgJsonGlob: /home/runner/work/Calculator/vcpkg #not needed
       #   vcpkgArguments: 'install wxwidgets:x64-windows-static'
          
  

  release_web:
    name: Web Release
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}
      ACTIONS_STEP_DEBUG: true

    steps:
      - uses: actions/checkout@v4



      - name: Create Artifact
        run: |
          mkdir release
          pwd
          ls -R
          cp build/Calc_App.html release/index.html
          cp build/Calc_App.js release/Main.js
          cp build/Calc_App.wasm release/Main.wasm

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: release

      - name: Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Create release zip and run Butler

        # Here we say that we will use the BUTLER_API_KEY as an environment variable
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          cd release
          zip -r ../release.zip *
          cd ..

          # Butler will read the API key from the environment variable
          ./butler login
          ./butler push release.zip CodeRedRanger/Calc_App:html5
          ./butler logout
