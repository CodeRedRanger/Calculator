  release_web:
    name: Web Release
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}
      ACTIONS_STEP_DEBUG: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get update 
          sudo apt-get install -y  gcc-multilib python3 curl zip unzip
          #sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev
          sudo apt-get install -y libtool
          sudo apt install -y build-essential #libwxgtk3.0-gtk3-dev 
          sudo apt install autoconf automake libtool
          sudo apt-get install -y build-essential cmake git curl unzip
          sudo apt-get install libtool libltdl-dev
          libtoolize --force
          sudo apt install libgtk-3-dev
          #aclocal
          #autoheader
          #automake --add-missing --force-missing
          #autoconf
      - name: Clean build directory
        run: rm -f build/CMakeCache.txt
        #run: rm -rf ${{ github.workspace }}\build

      - name: Create Build Directory
        run: cmake -E make_directory ${{ github.workspace }}\build

