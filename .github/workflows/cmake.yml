  release_web:
    name: Web Release
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}
      ACTIONS_STEP_DEBUG: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get update 
          sudo apt-get install -y  gcc-multilib python3 curl zip unzip
          #sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev
          sudo apt-get install -y libtool
          sudo apt install -y build-essential #libwxgtk3.0-gtk3-dev 
          sudo apt install autoconf automake libtool
          sudo apt-get install -y build-essential cmake git curl unzip
          sudo apt-get install libtool libltdl-dev
          libtoolize --force
          sudo apt install libgtk-3-dev
          #aclocal
          #autoheader
          #automake --add-missing --force-missing
          #autoconf


      - name: Clean build directory
        run: rm -f build/CMakeCache.txt
        #run: rm -rf ${{ github.workspace }}\build

      - name: Create Build Directory
        run: cmake -E make_directory ${{ github.workspace }}\build

      #- name: Install vcpkg 
      #  shell: pwsh
       # run: |
        #  git clone https://github.com/microsoft/vcpkg.git ${{ github.workspace }}/vcpkg
         # cd ${{ github.workspace }}/vcpkg
          #./bootstrap-vcpkg.sh
          #already commented out below
          #cd ${{ github.workspace }}
          #vcpkg install

      #- name: Set up CMake toolchain file
       # run: |
        # echo "CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux #>> $GITHUB_ENV # -S .  -B ./build 

        #new
      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v12
        id: setup-emsdk
        with:
          version: 'latest'

      - name: Set up cache for wxWidgets build
        id: cache-wxwidgets
        uses: actions/cache@v4
        with:
          path: ./build/wxwidgets-wasm
          key: ubuntu-latest-wxwidgets-${{ hashFiles('3rdparty/wxwidgets/".git"/index') }}
          restore-keys: |
            ubuntu-latest-wxwidgets-

      - name: Build wxWidgets with Emscripten
        if: steps.cache-wxwidgets.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/wxwidgets-wasm
          cd build/wxwidgets-wasm
          emcmake cmake ../../3rdparty/wxwidgets -G Ninja \
           -DwxBUILD_SAMPLES=NONE \
           -DwxBUILD_DEMOS=NONE \
           -DwxBUILD_TESTS=NONE \
           -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Set up cache for Project build
        id: cache-project
        uses: actions/cache@v4
        with:
          path: ./build/wasm
          key: ubuntu-latest-wasm-${{ hashFiles('CMakeLists.txt', '**/*.cpp', '**/*.h') }}-$ {{ github.sha }}

      - name: Configure and Build Project for WebAssembly
        run: |
         mkdir -p build/wasm
         cd build/wasm
         emcmake cmake ../.. -G Ninja \
           -DCMAKE_BUILD_TYPE=Release
         cmake --build .

      - name: Upload WebAssembly build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: build/wasm/*.wasm
      

      #- name: Installs wxWidgets #including wxWidgets via vcpkg
       # shell: pwsh
        #run: |
         # ${{ github.workspace }}/vcpkg/vcpkg install wxwidgets:wasm-emscripten #--triplet wasm32-emscripten # --recurse #   vcpkg install #--triplet=x64-linux
         

      #- name: Integrate vcpkg
      #  run: vcpkg integrate install

      #- name: Checkout emsdk
      #  run: git clone https://github.com/emscripten-core/emsdk.git ${{ github.workspace }}/emsdk

      #- name: Configure Emscripten
      #  shell: bash
      #  run: |
       #   ./emsdk/emsdk install latest
       #   ./emsdk/emsdk activate latest

      #- name: Configure CMake
      #  run: |
      #    cmake -S . -B build "-DCMAKE_BUILD_TYPE=Release" "-Wno-dev" "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ github.workspace }}/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=wasm-emscripten" 
          #already commented out
          #cmake -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -S .  -B ./build 
          #cmake -DwxWidgets_CONFIG_EXECUTABLE=${{ github.workspace }}/vcpkg_installed/x64-windows/share/wxwidgets
    
      #- name: Build 
      #  run: cmake --build build #./build --config Release

      - name: Create Artifact
        run: |
          mkdir release
          pwd
          ls -R
          cp build/Calc_App.html release/index.html
          cp build/Calc_App.js release/Main.js
          cp build/Calc_App.wasm release/Main.wasm

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: release

      - name: Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Create release zip and run Butler

        # Here we say that we will use the BUTLER_API_KEY as an environment variable
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          cd release
          zip -r ../release.zip *
          cd ..

          # Butler will read the API key from the environment variable
          ./butler login
          ./butler push release.zip CodeRedRanger/Calc_App:html5
          ./butler logout
