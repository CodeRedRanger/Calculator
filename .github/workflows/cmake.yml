name: Build wxWidgets-Wasm Application

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  build:
    runs-on: ubuntu-latest
    #env:
      #VCPKG_ROOT: ${{ github.workspace }}
      #ACTIONS_STEP_DEBUG: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git 
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
 
          cd ..
          
          git clone http://github.com/CodeRedRanger/wxWidgets-wasm.git --recurse-submodules #http://github.com/ahilss/wxWidgets-wasm.git
          cd wxWidgets-wasm

          git clean -dfx

          curl -L0 http://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.sub
          curl -L0 http://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.guess

          find . -name "config.sub" -exec cp config.sub {} \;
          find . -name "config.guess" -exec cp config.guess {} \;
          
          git submodule update --init src/jpeg
          git submodule update --init 3rdparty/catch
          #git submodule update --init src/zlib
          #git submodule update --init src/png
          #git submodule update --init src/tiff
          #git submodule update --init src/expat
          
          export CONFIGURE_ARGS=" --host=wasm32-unknown-emscripten --with-cxx=14 --enable-utf8 --enable-universal --disable-shared --disable-exceptions --disable-richtext --without-libtiff --without-zlib --disable-xlocale --disable-dependency-tracking --enable-dynamicloader=no --prefix=$(pwd)/install --libdir=$(pwd)/install/lib64" 
          export EMMAKEN_CFLAGS="-s USE_ZLIB=1"
          emconfigure ./configure $CONFIGURE_ARGS          
          emmake make -j$(nproc) VERBOSE=1 > emmake_output.log 2>&1 #-DCMAKE_EXE_LINKER_FLAGS="-s USE_ZLIB=1"
          emmake make install
          cd .. 
          
          mkdir build && cd build
          emcmake cmake ..
          emmake make

      - name: Debug make failure
        if: failure()
        run: |
          cd wxWidgets-wasm
          echo "---Contents of emmake_output.log --"
          cat emmake_output.log
          
          
      #- name: Configure CMake
      #  run: |
      #    emcmake cmake -S . -B build "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ github.workspace }}/build/emsdk-cache/cmake/Modules/Platform/Emscripten.cmake" "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" #"-DVCPKG_TARGET_TRIPLET=wasm32-emscripten"
      #    emcmake cmake -S . -B build "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ steps.setup-emsdk.outputs.emscripten-path}}/cmake/Modules/Platform/Emscripten.cmake" "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/build/wxWidgets-cache/cmake/Modules/Platform/Emscripten.cmake" #"-DVCPKG_TARGET_TRIPLET=wasm32-emscripten"
          #cmake -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -S .  -B ./build 
          #cmake -DwxWidgets_CONFIG_EXECUTABLE=${{ github.workspace }}/vcpkg_installed/x64-windows/share/wxwidgets
    
     # - name: Build 
      #  run: cmake --build build #./build --config Release

      - name: Create Artifact
        run: |
          mkdir release
          pwd
          ls -R
          cp build/Calc_App.html release/index.html
          cp build/Calc_App.js release/Main.js
          cp build/Calc_App.wasm release/Main.wasm
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: release

      - name: Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V
      - name: Create release zip and run Butler

        # Here we say that we will use the BUTLER_API_KEY as an environment variable
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          cd release
          zip -r ../release.zip *
          cd ..
          # Butler will read the API key from the environment variable
          ./butler login
          ./butler push release.zip CodeRedRanger/Calc_App:html5
          ./butler logout
